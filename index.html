<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Mirrors src/i18n/LocaleContext.tsx's initialLocale() so <html lang>
      // is correct before React hydrates, instead of flashing "ko" for
      // English-locale visitors. Errors (e.g. localStorage blocked) fall
      // back to the static "ko" default already on the tag.
      try {
        var savedLocale = localStorage.getItem('airpass-site-locale')
        document.documentElement.lang =
          savedLocale === 'ko' || savedLocale === 'en'
            ? savedLocale
            : navigator.language.toLowerCase().startsWith('ko')
              ? 'ko'
              : 'en'
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>AirPass — Mac, Windows, Linux 사이 파일 전송</title>
    <meta
      name="description"
      content="Mac에서 Windows로, Windows에서 Mac으로. Mac, Windows, Linux 사이에서 파일을 바로 보내고 받으세요."
    />
    <meta property="og:title" content="AirPass" />
    <meta
      property="og:description"
      content="Mac에서 Windows로, Windows에서 Mac으로. Mac, Windows, Linux 사이에서 파일을 바로 보내고 받으세요."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
